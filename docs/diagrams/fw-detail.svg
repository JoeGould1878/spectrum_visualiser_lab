</style><rect width="100%" height="100%" fill="#f4f6f8"/><text x="24" y="34" class="th">Spectrum visualiser · firmware detail (one frame)</text><text x="24" y="70" class="tb2">audio_task · core 0 · once per captured frame (≈ 39 per s)</text><text x="536" y="70" class="tb2">display_task · core 1 · every 25 ms (40 fps)</text><rect x="24" y="92" width="464" height="50" rx="6" class="bx"/><text x="38" y="113" class="tmb">adc_sampler_read()</text><text x="38" y="131" class="ts">1024 raw 12-bit samples = 25.6 ms at 40 kHz (bass mode: 2048)</text><path d="M256.0 142L256.0 158" class="w w-sig" marker-end="url(#ar-sig)"/><rect x="24" y="158" width="464" height="50" rx="6" class="bx"/><text x="38" y="179" class="tmb">frame stats</text><text x="38" y="197" class="ts">min/max → clipping flag · RMS → silence flag</text><path d="M256.0 208L256.0 224" class="w w-sig" marker-end="url(#ar-sig)"/><rect x="24" y="224" width="464" height="50" rx="6" class="bx"/><text x="38" y="245" class="tmb">remove DC</text><text x="38" y="263" class="ts">subtract the frame mean (the preamp&#x27;s ≈ 1.5 V bias)</text><path d="M256.0 274L256.0 290" class="w w-sig" marker-end="url(#ar-sig)"/><rect x="24" y="290" width="464" height="50" rx="6" class="bx"/><text x="38" y="311" class="tmb">decimate · bass mode only</text><text x="38" y="329" class="ts">63-tap Blackman low-pass, keep 1 in 4 → 10 kHz</text><path d="M256.0 340L256.0 356" class="w w-sig" marker-end="url(#ar-sig)"/><rect x="24" y="356" width="464" height="50" rx="6" class="bx"/><text x="38" y="377" class="tmb">Hann window</text><text x="38" y="395" class="ts">dsps_wind_hann_f32: less leakage into neighbouring columns</text><path d="M256.0 406L256.0 422" class="w w-sig" marker-end="url(#ar-sig)"/><rect x="24" y="422" width="464" height="50" rx="6" class="bx bx-acc"/><text x="38" y="443" class="tmb">FFT</text><text x="38" y="461" class="ts">dsps_fft2r_fc32 + bit reversal, N = 1024 (bass 512)</text><path d="M256.0 472L256.0 488" class="w w-sig" marker-end="url(#ar-sig)"/><rect x="24" y="488" width="464" height="50" rx="6" class="bx"/><text x="38" y="509" class="tmb">magnitude → dBFS</text><text x="38" y="527" class="ts">512 bins × 39.1 Hz (bass 256 × 19.5 Hz); 0 dB = full-scale sine</text><path d="M256.0 538L256.0 554" class="w w-sig" marker-end="url(#ar-sig)"/><rect x="24" y="554" width="464" height="50" rx="6" class="bx bx-acc"/><text x="38" y="575" class="tmb">band_map_apply()</text><text x="38" y="593" class="ts">loudest bin per column → 32 levels; hybrid log 100 Hz–8 kHz</text><path d="M256.0 604L256.0 620" class="w w-sig" marker-end="url(#ar-sig)"/><rect x="24" y="620" width="464" height="50" rx="6" class="bx"/><text x="38" y="641" class="tmb">tone_find()</text><text x="38" y="659" class="ts">peak bin + parabolic interpolation → frequency and column</text><path d="M256.0 670L256.0 686" class="w w-sig" marker-end="url(#ar-sig)"/><rect x="24" y="686" width="464" height="50" rx="6" class="bx"/><text x="38" y="707" class="tmb">status + send</text><text x="38" y="725" class="ts">above-range check · xQueueOverwrite · FRAME/TONE to serial</text><rect x="536" y="92" width="440" height="50" rx="6" class="bx"/><text x="550" y="113" class="tmb">xQueueReceive(…, 0)</text><text x="550" y="131" class="ts">take the newest frame; none for 500 ms → blank</text><path d="M756.0 142L756.0 158" class="w w-ink2" marker-end="url(#ar-ink)"/><rect x="536" y="158" width="440" height="50" rx="6" class="bx"/><text x="550" y="179" class="tmb">choose view</text><text x="550" y="197" class="ts">not listening → blank · tone-finder → digits · else bars</text><path d="M756.0 208L756.0 224" class="w w-ink2" marker-end="url(#ar-ink)"/><rect x="536" y="224" width="440" height="50" rx="6" class="bx"/><text x="550" y="245" class="tmb">bar_model_update()</text><text x="550" y="263" class="ts">−60 dB floor, 4 dB/row, falls 20 rows/s, peaks hold 0.5 s</text><path d="M756.0 274L756.0 290" class="w w-ink2" marker-end="url(#ar-ink)"/><rect x="536" y="290" width="440" height="50" rx="6" class="bx"/><text x="550" y="311" class="tmb">draw</text><text x="550" y="329" class="ts">frame_draw_bar / _peak, or “440Hz” + a marker at its column</text><path d="M756.0 340L756.0 356" class="w w-ink2" marker-end="url(#ar-ink)"/><rect x="536" y="356" width="440" height="50" rx="6" class="bx"/><text x="550" y="377" class="tmb">frame_draw_status()</text><text x="550" y="395" class="ts">top-right, right→left: silent · clip · above range · not listening</text><path d="M756.0 406L756.0 422" class="w w-ink2" marker-end="url(#ar-ink)"/><rect x="536" y="422" width="440" height="50" rx="6" class="bx"/><text x="550" y="443" class="tmb">frame_to_device_rows()</text><text x="550" y="461" class="ts">apply the module&#x27;s orientation flags</text><path d="M756.0 472L756.0 488" class="w w-ink2" marker-end="url(#ar-ink)"/><rect x="536" y="488" width="440" height="50" rx="6" class="bx"/><text x="550" y="509" class="tmb">max7219_write_all()</text><text x="550" y="527" class="ts">4 chips × 8 rows over SPI; control registers re-sent every 1 s</text><path d="M488 711.0L512 711.0L512 117.0L536 117.0" class="w w-ink2" marker-end="url(#ar-ink)"/><rect x="536" y="564" width="440" height="92" rx="6" class="bx q"/><text x="550" y="586" class="tmb">audio_frame_t (the queue holds one)</text><text x="550" y="605" class="ts">32 column levels · tone Hz + column · status bits · timestamp</text><text x="550" y="622" class="ts">If the display is late it skips old frames instead of lagging.</text><text x="550" y="639" class="ts">Shared between the two cores without locks.</text><text x="24" y="764" class="tb2">Modes (MODE button)</text><text x="24" y="784" class="ts">FULL: hybrid log 100 Hz–8 kHz  ·  BASS/VOICE: decimated, 50 Hz–2.5 kHz  ·  TONE-FINDER: frequency as digits  ·  LINEAR: baseline for comparison</text></svg>