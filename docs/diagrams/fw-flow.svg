<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1020" width="1000" height="1020" role="img" aria-label="Spectrum visualiser · software flowchart"><defs>
<marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker>
<marker id="ar-sig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-sig"/></marker>
<marker id="ar-spi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-spi"/></marker>
</defs><style>
.t{fill:#16202b;font:13px 'IBM Plex Sans','DejaVu Sans',Arial,sans-serif}
.th{fill:#16202b;font:600 17px 'IBM Plex Sans','DejaVu Sans',Arial,sans-serif}
.tb{fill:#16202b;font:600 14px 'IBM Plex Sans','DejaVu Sans',Arial,sans-serif}
.tb2{fill:#16202b;font:600 13px 'IBM Plex Sans','DejaVu Sans',Arial,sans-serif}
.ts{fill:#5d6b7b;font:11.5px 'IBM Plex Sans','DejaVu Sans',Arial,sans-serif}
.tm{fill:#16202b;font:12px 'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace}
.tmb{fill:#16202b;font:600 12.5px 'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace}
.bx{fill:#ffffff;stroke:#9aa7b5;stroke-width:1.2}
.bx-acc{fill:#e3f0f5;stroke:#1f6f8b;stroke-width:1.6}
.bx-dash{fill:none;stroke:#9aa7b5;stroke-width:1.2;stroke-dasharray:6 4}
.ctr{fill:#eef2f6;stroke:#9aa7b5;stroke-width:1.2}
.q{fill:#fff7e0;stroke:#b98a12}
.pill{fill:#ffffff;stroke:#9aa7b5;stroke-width:1.2}
.res{fill:#ffffff;stroke:#3d4a59;stroke-width:1.5}
.cap{fill:none;stroke:#3d4a59;stroke-width:1.5}
.grid{fill:#16181b;stroke:#9aa7b5}
.led{fill:#c8302c}
.pin{fill:#ffffff;stroke:#3d4a59;stroke-width:1.5}
.w{fill:none;stroke:#3d4a59;stroke-width:1.6}
.w-ink2{stroke:#3d4a59}
.w-sig{stroke:#0f7b6c;stroke-width:2}
.w-spi{stroke:#3655b3;stroke-width:2}
.w-p3{stroke:#c2410c;stroke-width:2}
.w-p5{stroke:#b3261e;stroke-width:2}
.w-gnd{stroke:#55606d}
.dash{stroke-dasharray:6 4}
.dec{fill:#fff7e0;stroke:#b98a12;stroke-width:1.4}
.io{stroke:#0f7b6c;stroke-width:1.4}
.fork{stroke:#3d4a59;stroke-width:5}
.rule{stroke:#9aa7b5;stroke-width:0.8}
.lbl{fill:#1f6f8b;font:600 11.5px 'IBM Plex Sans','DejaVu Sans',Arial,sans-serif}
.pinno{fill:#1f6f8b;font:600 11px 'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace}
.dot{fill:#3d4a59}
.mk{fill:#3d4a59}
.mk-sig{fill:#0f7b6c}
.mk-spi{fill:#3655b3}
</style><rect width="100%" height="100%" fill="#f4f6f8"/><text x="24" y="34" class="th">Spectrum visualiser · software flowchart</text><rect x="390.0" y="60" width="220" height="34" rx="17.0" class="bx bx-acc"/><text x="500" y="82.0" class="tb2" text-anchor="middle">Power on / reset</text><path d="M500 94L500 112" class="w w-ink2" marker-end="url(#ar-ink)"/><rect x="170.0" y="112" width="660" height="52" rx="4" class="bx"/><text x="500" y="134.0" class="t" text-anchor="middle">app_main (runs once)</text><text x="500" y="150.0" class="ts" text-anchor="middle">load settings from NVS → create 1-slot queue → start display, audio and input tasks</text><path d="M500 164L500 184" class="w w-ink2"/><path d="M170 186L720 186" class="w fork"/><path d="M170 188L170 214" class="w w-ink2" marker-end="url(#ar-ink)"/><path d="M720 188L720 214" class="w w-ink2" marker-end="url(#ar-ink)"/><text x="728" y="204" class="ts">the three tasks then run side by side, for ever</text><rect x="24" y="214" width="400" height="560" rx="10" class="ctr"/><rect x="576" y="214" width="400" height="500" rx="10" class="ctr"/><text x="40" y="238" class="tmb">audio_task</text><text x="40" y="255" class="ts">core 0 · one pass per 25.6 ms of sound</text><text x="592" y="238" class="tmb">display_task</text><text x="592" y="255" class="ts">core 1 · one pass every 25 ms (40 fps)</text><rect x="55.0" y="270" width="230" height="40" rx="4" class="bx"/><text x="170" y="286.0" class="t" text-anchor="middle">Start ADC1 on GPIO1</text><text x="170" y="302.0" class="ts" text-anchor="middle">40 kHz, DMA into a buffer</text><path d="M170 310L170 338" class="w w-ink2" marker-end="url(#ar-ink)"/><circle cx="170" cy="326" r="3.2" class="dot"/><polygon points="170,338.0 250.0,366 170,394.0 90.0,366" class="dec"/><text x="170" y="363" class="tb2" text-anchor="middle">Mode</text><text x="170" y="377" class="tb2" text-anchor="middle">changed?</text><path d="M250 366L296 366" class="w w-ink2" marker-end="url(#ar-ink)"/><text x="260" y="359" class="lbl">Yes</text><rect x="296.0" y="346" width="104" height="40" rx="4" class="bx"/><text x="348" y="362.0" class="t" text-anchor="middle">Rebuild the</text><text x="348" y="378.0" class="ts" text-anchor="middle">column map</text><path d="M348 386V414H176" class="w w-ink2" marker-end="url(#ar-ink)"/><path d="M170 394L170 414" class="w w-ink2"/><text x="176" y="408" class="lbl">No</text><circle cx="170" cy="414" r="3.2" class="dot"/><path d="M170 414L170 426" class="w w-ink2" marker-end="url(#ar-ink)"/><polygon points="170,426.0 250.0,454 170,482.0 90.0,454" class="dec"/><text x="170" y="458" class="tb2" text-anchor="middle">Listening?</text><path d="M250 454L296 454" class="w w-ink2" marker-end="url(#ar-ink)"/><text x="260" y="447" class="lbl">No</text><rect x="296.0" y="434" width="104" height="40" rx="4" class="bx"/><text x="348" y="450.0" class="t" text-anchor="middle">Blank frame</text><text x="348" y="466.0" class="ts" text-anchor="middle">wait 100 ms</text><path d="M400 454H412V326H176" class="w w-ink2" marker-end="url(#ar-ink)"/><path d="M170 482L170 502" class="w w-ink2" marker-end="url(#ar-ink)"/><text x="176" y="496" class="lbl">Yes</text><polygon points="65.0,502 295.0,502 275.0,542 45.0,542" class="bx io"/><text x="170" y="518.0" class="t" text-anchor="middle">Read 1024 samples</text><text x="170" y="534.0" class="ts" text-anchor="middle">25.6 ms of sound</text><path d="M170 542L170 562" class="w w-ink2" marker-end="url(#ar-ink)"/><rect x="55.0" y="562" width="230" height="40" rx="4" class="bx"/><text x="170" y="578.0" class="t" text-anchor="middle">Remove DC · Hann window · FFT</text><text x="170" y="594.0" class="ts" text-anchor="middle">512 bins in dB, 39 Hz each</text><path d="M170 602L170 622" class="w w-ink2" marker-end="url(#ar-ink)"/><rect x="55.0" y="622" width="230" height="40" rx="4" class="bx"/><text x="170" y="638.0" class="t" text-anchor="middle">Bins → 32 column levels</text><text x="170" y="654.0" class="ts" text-anchor="middle">loudest bin in each column</text><path d="M170 662L170 682" class="w w-ink2" marker-end="url(#ar-ink)"/><polygon points="65.0,682 295.0,682 275.0,730 45.0,730" class="bx io"/><text x="170" y="702.0" class="t" text-anchor="middle">Put frame in the queue</text><text x="170" y="718.0" class="ts" text-anchor="middle">(replaces any unread one)</text><path d="M170 730V752H38V326H164" class="w w-ink2" marker-end="url(#ar-ink)"/><rect x="440" y="520" width="120" height="80" rx="6" class="bx q"/><text x="500" y="545" class="tmb" text-anchor="middle">Queue</text><text x="500" y="563" class="ts" text-anchor="middle">1 slot</text><text x="500" y="579" class="ts" text-anchor="middle">newest frame wins</text><path d="M285 706H500V600" class="w w-ink2" marker-end="url(#ar-ink)"/><path d="M500 520V440H640" class="w w-ink2" marker-end="url(#ar-ink)"/><rect x="605.0" y="270" width="230" height="40" rx="4" class="bx"/><text x="720" y="286.0" class="t" text-anchor="middle">Start SPI2 + 4 × MAX7219</text><text x="720" y="302.0" class="ts" text-anchor="middle">1 MHz, brightness from NVS</text><path d="M720 310L720 346" class="w w-ink2" marker-end="url(#ar-ink)"/><circle cx="720" cy="326" r="3.2" class="dot"/><rect x="605.0" y="346" width="230" height="48" rx="4" class="bx"/><text x="720" y="366.0" class="t" text-anchor="middle">Wait for the 25 ms tick</text><text x="720" y="382.0" class="ts" text-anchor="middle">apply new brightness</text><path d="M720 394L720 412" class="w w-ink2" marker-end="url(#ar-ink)"/><polygon points="720,412.0 800.0,440 720,468.0 640.0,440" class="dec"/><text x="720" y="437" class="tb2" text-anchor="middle">New frame</text><text x="720" y="451" class="tb2" text-anchor="middle">in queue?</text><path d="M800 440L850 440" class="w w-ink2" marker-end="url(#ar-ink)"/><text x="810" y="433" class="lbl">No</text><rect x="850.0" y="420" width="104" height="40" rx="4" class="bx"/><text x="902" y="436.0" class="t" text-anchor="middle">No frame for</text><text x="902" y="452.0" class="ts" text-anchor="middle">0.5 s → blank</text><path d="M902 460V494H726" class="w w-ink2" marker-end="url(#ar-ink)"/><path d="M720 468L720 494" class="w w-ink2"/><text x="726" y="486" class="lbl">Yes</text><circle cx="720" cy="494" r="3.2" class="dot"/><path d="M720 494L720 514" class="w w-ink2" marker-end="url(#ar-ink)"/><rect x="605.0" y="514" width="230" height="48" rx="4" class="bx"/><text x="720" y="534.0" class="t" text-anchor="middle">Bar rows = (dB − floor) ÷ 3 dB</text><text x="720" y="550.0" class="ts" text-anchor="middle">jump up at once, fall 20 rows/s</text><path d="M720 562L720 582" class="w w-ink2" marker-end="url(#ar-ink)"/><rect x="605.0" y="582" width="230" height="40" rx="4" class="bx"/><text x="720" y="598.0" class="t" text-anchor="middle">Draw 32 bars</text><text x="720" y="614.0" class="ts" text-anchor="middle">then apply the fixed orientation</text><path d="M720 622L720 642" class="w w-ink2" marker-end="url(#ar-ink)"/><polygon points="615.0,642 845.0,642 825.0,682 595.0,682" class="bx io"/><text x="720" y="658.0" class="t" text-anchor="middle">Send 8 rows × 4 chips</text><text x="720" y="674.0" class="ts" text-anchor="middle">over SPI</text><path d="M720 682V700H966V326H726" class="w w-ink2" marker-end="url(#ar-ink)"/><rect x="24" y="800" width="952" height="170" rx="10" class="ctr"/><text x="40" y="824" class="tmb">input_task</text><text x="130" y="824" class="ts">core 1 · one pass every 10 ms</text><circle cx="60" cy="892" r="3.2" class="dot"/><path d="M60 892L80 892" class="w w-ink2" marker-end="url(#ar-ink)"/><rect x="80.0" y="870" width="120" height="44" rx="4" class="bx"/><text x="140" y="896.0" class="t" text-anchor="middle">Wait 10 ms</text><path d="M200 892L230 892" class="w w-ink2" marker-end="url(#ar-ink)"/><polygon points="245.0,870 395.0,870 375.0,914 225.0,914" class="bx io"/><text x="310" y="888.0" class="t" text-anchor="middle">Read both buttons</text><text x="310" y="904.0" class="ts" text-anchor="middle">debounced</text><path d="M385 892L410 892" class="w w-ink2" marker-end="url(#ar-ink)"/><polygon points="470,862.0 530.0,892 470,922.0 410.0,892" class="dec"/><text x="470" y="896" class="tb2" text-anchor="middle">Pressed?</text><path d="M530 892L560 892" class="w w-ink2" marker-end="url(#ar-ink)"/><text x="536" y="885" class="lbl">Yes</text><rect x="560" y="840" width="240" height="104" rx="4" class="bx"/><text x="574" y="874" class="tm">MODE short</text><text x="676" y="874" class="ts">→ LOG ↔ LINEAR</text><text x="574" y="894" class="tm">MODE long</text><text x="676" y="894" class="ts">→ next brightness</text><text x="574" y="914" class="tm">LISTEN short</text><text x="676" y="914" class="ts">→ stop / start</text><path d="M800 892L822 892" class="w w-ink2" marker-end="url(#ar-ink)"/><rect x="822.0" y="870" width="136" height="44" rx="4" class="bx"/><text x="890" y="888.0" class="t" text-anchor="middle">Save to NVS</text><text x="890" y="904.0" class="ts" text-anchor="middle">kept after power-off</text><path d="M890 914V952H60V896" class="w w-ink2" marker-end="url(#ar-ink)"/><path d="M470 922V952" class="w w-ink2" marker-end="url(#ar-ink)"/><text x="476" y="938" class="lbl">No</text><circle cx="470" cy="952" r="3.2" class="dot"/><path d="M610 840V786H250V776" class="w w-ink2 dash" marker-end="url(#ar-ink)"/><text x="618" y="820" class="ts">mode, listening</text><path d="M760 840V716" class="w w-ink2 dash" marker-end="url(#ar-ink)"/><text x="768" y="760" class="ts">brightness</text><text x="24" y="1000" class="tb2">Shapes:</text><rect x="90" y="986" width="40" height="18" rx="9" class="bx bx-acc"/><text x="138" y="1000" class="ts">start</text><rect x="190" y="986" width="40" height="18" rx="3" class="bx"/><text x="238" y="1000" class="ts">step</text><polygon points="306,984 326,995 306,1006 286,995" class="dec"/><text x="334" y="1000" class="ts">decision</text><polygon points="408,986 448,986 436,1004 396,1004" class="bx io"/><text x="456" y="1000" class="ts">hardware in / out</text><rect x="572" y="986" width="40" height="18" rx="3" class="bx q"/><text x="620" y="1000" class="ts">queue between cores</text><path d="M752 995L788 995" class="w w-ink2 dash" marker-end="url(#ar-ink)"/><text x="796" y="1000" class="ts">button request (a flag)</text></svg>