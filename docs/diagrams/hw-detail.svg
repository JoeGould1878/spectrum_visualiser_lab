" marker-end="url(#ar-spi)"/><rect x="800" y="424" width="176" height="36" rx="6" class="bx"/><text x="812" y="447" class="t">#3 · 8 × 8 LEDs</text><text x="912" y="316" class="ts">DOUT→DIN</text><rect x="24" y="510" width="952" height="66" rx="6" class="bx"/><text x="40" y="534" class="tb2">Power</text><text x="40" y="552" class="ts">USB 5 V → board 3.3 V regulator → ESP32-S3 and MAX9814 (3.3 V keeps the mic output inside the ADC range).</text><text x="40" y="568" class="ts">USB 5 V → MAX7219 module. Its logic inputs get 3.3 V, below the 3.5 V spec: watch for glitches, buffer if needed.</text></svg>