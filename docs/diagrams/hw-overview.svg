</style><rect width="100%" height="100%" fill="#f4f6f8"/><text x="24" y="34" class="th">Spectrum visualiser · hardware overview</text><rect x="24" y="90" width="170" height="100" rx="6" class="bx"/><text x="109.0" y="126" class="tb" text-anchor="middle">Sound source</text><text x="109.0" y="145" class="ts" text-anchor="middle">voice, music, phone tone</text><text x="109.0" y="164" class="ts" text-anchor="middle">or function generator</text><rect x="250" y="90" width="190" height="100" rx="6" class="bx"/><text x="345.0" y="126" class="tb" text-anchor="middle">Input stage</text><text x="345.0" y="145" class="ts" text-anchor="middle">electret + NPN preamp</text><text x="345.0" y="164" class="ts" text-anchor="middle">or bias + RC test input</text><rect x="520" y="90" width="230" height="100" rx="6" class="bx bx-acc"/><text x="635.0" y="126" class="tb" text-anchor="middle">ESP32-S3</text><text x="635.0" y="145" class="ts" text-anchor="middle">samples at 40 kHz, FFT,</text><text x="635.0" y="164" class="ts" text-anchor="middle">maps 32 columns, reads buttons</text><rect x="800" y="90" width="176" height="100" rx="6" class="bx"/><text x="888.0" y="126" class="tb" text-anchor="middle">LED display</text><text x="888.0" y="145" class="ts" text-anchor="middle">4 × MAX7219, 32 × 8</text><text x="888.0" y="164" class="ts" text-anchor="middle">one column per band</text><path d="M194 140.0L250 140.0" class="w w-sig" marker-end="url(#ar-sig)"/><text x="222.0" y="132.0" class="ts" text-anchor="middle">sound</text><path d="M440 140.0L520 140.0" class="w w-sig" marker-end="url(#ar-sig)"/><text x="480.0" y="132.0" class="ts" text-anchor="middle">analogue</text><path d="M750 140.0L800 140.0" class="w w-spi" marker-end="url(#ar-spi)"/><text x="775.0" y="132.0" class="ts" text-anchor="middle">SPI</text><rect x="470" y="270" width="150" height="64" rx="6" class="bx"/><text x="545.0" y="297" class="tb" text-anchor="middle">Buttons × 2</text><text x="545.0" y="316" class="ts" text-anchor="mi