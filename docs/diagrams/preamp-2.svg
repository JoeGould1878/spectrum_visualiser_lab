</style><rect width="100%" height="100%" fill="#f4f6f8"/><text x="24" y="34" class="th">Mic preamp · LM358, two stages (×1100)</text><circle cx="380" cy="110" r="3.2" class="dot"/><path d="M380 110L380 146.0" class="w w-ink2"/><rect x="372" y="146.0" width="16" height="48" rx="1" class="res"/><path d="M380 194.0L380 230" class="w w-ink2"/><text x="366" y="174.0" class="ts" text-anchor="end">220 kΩ</text><circle cx="380" cy="230" r="3.2" class="dot"/><path d="M380 230L380 331.0" class="w w-ink2"/><rect x="372" y="331.0" width="16" height="48" rx="1" class="res"/><path d="M380 379.0L380 480" class="w w-ink2"/><text x="366" y="359.0" class="ts" text-anchor="end">100 kΩ</text><circle cx="380" cy="480" r="3.2" class="dot"/><path d="M380 230L470 230" class="w w-sig"/><text x="458" y="224" class="pinno" text-anchor="middle">3</text><polygon points="470,200 470,320 570,260" class="bx bx-acc"/><text x="479" y="235" class="tb2">+</text><text x="479" y="296" class="tb2">−</text><text x="508" y="258" class="ts" text-anchor="middle">LM358</text><text x="508" y="272" class="ts" text-anchor="middle">half A</text><path d="M470 290H430V370" class="w w-ink2"/><text x="458" y="284" class="pinno" text-anchor="middle">2</text><circle cx="430" cy="370" r="3.2" class="dot"/><path d="M430 370L430 384" class="w w-ink2"/><rect x="422" y="384" width="16" height="40" rx="1" class="res"/><text x="444" y="408" class="ts">1 kΩ</text><path d="M430 424L430 440" class="w w-ink2"/><path d="M418 440L442 440" class="w w-ink2"/><path d="M418 447L442 447" class="w w-ink2"/><text x="408" y="438" class="ts">+</text><text x="448" y="448" class="ts">10 µF</text><path d="M430 447L430 480" class="w w-gnd"/><circle cx="430" cy="480" r="3.2" class="dot"/><path d="M430 370L530 370" class="w w-ink2"/><rect x="530" y="362" width="56" height="16" rx="1" class="res"/><text x="558" y="354" class="ts" text-anchor="middle">Rf 100 kΩ</text><path d="M586 370H610V260" class="w w-ink2"/><path d="M570 260L610 260" class="w w-sig"/><text x="584" y="252" class="pinno" text-anchor="middle">1</text><circle cx="610" cy="260" r="3.2" class="dot"/><circle cx="510" cy="110" r="3.2" class="dot"/><path d="M510 110L510 224" class="w w-p3"/><text x="520" y="216" class="pinno" text-anchor="middle">8</text><path d="M510 296V362A8 8 0 0 1 510 378V480" class="w w-gnd"/><text x="520" y="314" class="pinno" text-anchor="middle">4</text><circle cx="510" cy="480" r="3.2" class="dot"/><circle cx="548" cy="110" r="3.2" class="dot"/><path d="M548 110L548 146" class="w w-p3"/><path d="M536 146L560 146" class="w w-ink2"/><path d="M536 153L560 153" class="w w-ink2"/><text x="566" y="154" class="ts">100 nF</text><path d="M548 153L548 160" class="w w-gnd"/><path d="M548 160L548 168" class="w w-gnd"/><path d="M538 168L558 168" class="w w-gnd"/><path d="M542 172L554 172" class="w w-gnd"/><path d="M546 176L550 176" class="w w-gnd"/><text x="566" y="170" class="ts">at pins 8–4</text><path d="M610 260L640 260" class="w w-sig"/><path d="M640 248L640 272" class="w w-ink2"/><path d="M647 248L647 272" class="w w-ink2"/><text x="643" y="242" class="ts" text-anchor="middle">C3 1 µF</text><path d="M647 260H690V230H720" class="w w-sig"/><circle cx="720" cy="110" r="3.2" class="dot"/><path d="M720 110L720 146.0" class="w w-ink2"/><rect x="712" y="146.0" width="16" height="48" rx="1" class="res"/><path d="M720 194.0L720 230" class="w w-ink2"/><text x="706" y="174.0" class="ts" text-anchor="end">220 kΩ</text><circle cx="720" cy="230" r="3.2" class="dot"/><path d="M720 230L720 331.0" class="w w-ink2"/><rect x="712" y="331.0" width="16" height="48" rx="1" class="res"/><path d="M720 379.0L720 480" class="w w-ink2"/><text x="706" y="359.0" class="ts" text-anchor="end">100 kΩ</text><circle cx="720" cy="480" r="3.2" class="dot"/><path d="M720 230L810 230" class="w w-sig"/><text x="798" y="224" class="pinno" text-anchor="middle">5</text><polygon points="810,200 810,320 910,260" class="bx bx-acc"/><text x="819" y="235" class="tb2">+</text><text x="819" y="296" class="tb2">−</text><text x="848" y="258" class="ts" text-anchor="middle">LM358</text><text x="848" y="272" class="ts" text-anchor="middle">half B</text><path d="M810 290H770V370" class="w w-ink2"/><text x="798" y="284" class="pinno" text-anchor="middle">6</text><circle cx="770" cy="370" r="3.2" class="dot"/><path d="M770 370L770 384" class="w w-ink2"/><rect x="762" y="384" width="16" height="40" rx="1" class="res"/><text x="784" y="408" class="ts">1 kΩ</text><path d="M770 424L770 440" class="w w-ink2"/><path d="M758 440L782 440" class="w w-ink2"/><path d="M758 447L782 447" class="w w-ink2"/><text x="748" y="438" class="ts">+</text><text x="788" y="448" class="ts">10 µF</text><path d="M770 447L770 480" class="w w-gnd"/><circle cx="770" cy="480" r="3.2" class="dot"/><path d="M770 370L870 370" class="w w-ink2"/><rect x="870" y="362" width="56" height="16" rx="1" class="res"/><text x="898" y="354" class="ts" text-anchor="middle">Rf 10 kΩ</text><path d="M926 370H950V260" class="w w-ink2"/><path d="M910 260L950 260" class="w w-sig"/><text x="924" y="252" class="pinno" text-anchor="middle">7</text><circle cx="950" cy="260" r="3.2" class="dot"/><path d="M950 260L987.0 260" class="w w-sig"/><rect x="987.0" y="252" width="56" height="16" rx="1" class="res"/><path d="M1043.0 260L1080 260" class="w w-sig"/><text x="1015.0" y="246" class="ts" text-anchor="middle">4.7 kΩ</text><circle cx="1080" cy="260" r="3.2" class="dot"/><path d="M1080 260L1080 350" class="w w-gnd"/><path d="M1068 350L1092 350" class="w w-ink2"/><path d="M1068 357L1092 357" class="w w-ink2"/><text x="1098" y="358" class="ts">2.2 nF</text><path d="M1080 357L1080 480" class="w w-gnd"/><circle cx="1080" cy="480" r="3.2" class="dot"/><path d="M1080 260L1170 260" class="w w-sig"/><text x="1125.0" y="252" class="ts" text-anchor="middle">≈1.0 V + audio</text><rect x="1170" y="50" width="190" height="450" rx="6" class="bx bx-acc"/><text x="1265" y="100" class="tb" text-anchor="middle">ESP32-S3</text><text x="1265" y="118" class="ts" text-anchor="middle">Freenove board</text><text x="1180" y="74" class="tm">3V3</text><text x="1180" y="264" class="tm">GPIO1 · ADC1</text><text x="1180" y="484" class="tm">GND</text><text x="1265" y="330" class="ts" text-anchor="middle">display GND: use a</text><text x="1265" y="345" class="ts" text-anchor="middle">different GND pin</text><circle cx="1170" cy="70" r="3.2" class="dot"/><circle cx="1170" cy="260" r="3.2" class="dot"/><circle cx="1170" cy="480" r="3.2" class="dot"/><path d="M1170 70H56V110H76" class="w w-p3"/><text x="1158" y="62" class="ts" text-anchor="end">3V3 from the board (noisy)</text><path d="M76 110L80.0 110" class="w w-p3"/><rect x="80.0" y="102" width="56" height="16" rx="1" class="res"/><path d="M136.0 110L140 110" class="w w-p3"/><text x="108" y="96" class="ts" text-anchor="middle">R0 220 Ω</text><circle cx="140" cy="110" r="3.2" class="dot"/><path d="M140 110L720 110" class="w w-p3"/><text x="732" y="114" class="ts">filtered 3.3 V rail</text><path d="M140 110L140 290" class="w w-p3"/><path d="M128 290L152 290" class="w w-ink2"/><path d="M128 297L152 297" class="w w-ink2"/><text x="118" y="288" class="ts">+</text><text x="122" y="298" class="ts" text-anchor="end">C0</text><text x="122" y="314" class="ts" text-anchor="end">100 µF</text><path d="M140 297L140 480" class="w w-gnd"/><circle cx="140" cy="480" r="3.2" class="dot"/><path d="M140 480L1170 480" class="w w-gnd"/><text x="150" y="498" class="ts">GND rail</text><circle cx="230" cy="110" r="3.2" class="dot"/><path d="M230 110L230 146.0" class="w w-ink2"/><rect x="222" y="146.0" width="16" height="48" rx="1" class="res"/><path d="M230 194.0L230 230" class="w w-ink2"/><text x="244" y="174.0" class="ts">R1 2.2 kΩ</text><circle cx="230" cy="230" r="3.2" class="dot"/><path d="M230 230L230 274" class="w w-sig"/><circle cx="230" cy="290" r="16" class="cap"/><circle cx="230" cy="290" r="6" class="cap"/><text x="250" y="276" class="ts">+</text><text x="250" y="314" class="ts">−</text><path d="M230 306L230 480" class="w w-gnd"/><circle cx="230" cy="480" r="3.2" class="dot"/><text x="256" y="296" class="ts">electret</text><text x="256" y="330" class="ts">− = case pin</text><path d="M230 230L300 230" class="w w-sig"/><path d="M300 218L300 242" class="w w-ink2"/><path d="M307 218L307 242" class="w w-ink2"/><text x="290" y="222" class="ts">+</text><text x="303" y="212" class="ts" text-anchor="middle">C1 1 µF</text><path d="M307 230L380 230" class="w w-sig"/><text x="495" y="516" class="tb2" text-anchor="middle">Stage 1: gain 1 + 100k/1k ≈ ×101 (40 dB)</text><text x="835" y="516" class="tb2" text-anchor="middle">Stage 2: 1 + 10k/1k ≈ ×11 (21 dB)</text><text x="560" y="536" class="ts" text-anchor="middle">Total ≈ ×1100 (61 dB). Loud sound will clip: the bars stop at the top.</text><rect x="24.0" y="560" width="434.0" height="290" rx="6" class="bx"/><rect x="478.0" y="560" width="434.0" height="290" rx="6" class="bx"/><rect x="932.0" y="560" width="434.0" height="290" rx="6" class="bx"/><text x="40.0" y="584" class="tb2">1 · DC check before plugging into GPIO1</text><text x="40.0" y="602" class="ts">Power on, room quiet, meter black lead on GND.</text><text x="40.0" y="628" class="tm">pin 8 (filtered rail)</text><text x="442.0" y="628" class="tm" text-anchor="end">≈ 3.0–3.2 V</text><path d="M40.0 635L442.0 635" class="w rule"/><text x="40.0" y="650" class="tm">mic +</text><text x="442.0" y="650" class="tm" text-anchor="end">≈ 2.0–2.8 V</text><path d="M40.0 657L442.0 657" class="w rule"/><text x="40.0" y="672" class="tm">pin 3, pin 5</text><text x="442.0" y="672" class="tm" text-anchor="end">≈ 0.95 V</text><path d="M40.0 679L442.0 679" class="w rule"/><text x="40.0" y="694" class="tm">pin 2, pin 6</text><text x="442.0" y="694" class="tm" text-anchor="end">same as pin 3</text><path d="M40.0 701L442.0 701" class="w rule"/><text x="40.0" y="716" class="tm">pin 1, pin 7</text><text x="442.0" y="716" class="tm" text-anchor="end">≈ 0.9–1.1 V</text><path d="M40.0 723L442.0 723" class="w rule"/><text x="40.0" y="738" class="tm">GPIO1</text><text x="442.0" y="738" class="tm" text-anchor="end">same as pin 7</text><path d="M40.0 745L442.0 745" class="w rule"/><text x="40.0" y="776" class="ts">Output near 0 V or ≥ 1.7 V = stage stuck:</text><text x="40.0" y="792" class="ts">check Rf, the 1 kΩ + 10 µF leg and the</text><text x="40.0" y="808" class="ts">10 µF polarity; pin 3 not ≈ 0.95 V → check</text><text x="40.0" y="824" class="ts">the 220 k / 100 k divider and C1.</text><text x="494.0" y="584" class="tb2">2 · LM358 from above (notch at top)</text><rect x="665.0" y="614" width="60" height="150" rx="4" class="bx bx-acc"/><path d="M685.0 614A10 10 0 0 0 705.0 614" class="w"/><circle cx="677.0" cy="628" r="3" class="dot"/><path d="M655.0 636L665.0 636" class="w w-ink2"/><text x="674.0" y="640" class="pinno" text-anchor="middle">1</text><text x="651.0" y="634" class="tm" text-anchor="end">OUT A</text><text x="651.0" y="648" class="ts" text-anchor="end">Rf, C3</text><path d="M655.0 672L665.0 672" class="w w-ink2"/><text x="674.0" y="676" class="pinno" text-anchor="middle">2</text><text x="651.0" y="670" class="tm" text-anchor="end">IN A−</text><text x="651.0" y="684" class="ts" text-anchor="end">Rf, 1 kΩ</text><path d="M655.0 708L665.0 708" class="w w-ink2"/><text x="674.0" y="712" class="pinno" text-anchor="middle">3</text><text x="651.0" y="706" class="tm" text-anchor="end">IN A+</text><text x="651.0" y="720" class="ts" text-anchor="end">C1, bias</text><path d="M655.0 744L665.0 744" class="w w-ink2"/><text x="674.0" y="748" class="pinno" text-anchor="middle">4</text><text x="651.0" y="742" class="tm" text-anchor="end">GND</text><text x="651.0" y="756" class="ts" text-anchor="end">GND rail</text><path d="M725.0 636L735.0 636" class="w w-ink2"/><text x="716.0" y="640" class="pinno" text-anchor="middle">8</text><text x="739.0" y="634" class="tm">VCC</text><text x="739.0" y="648" class="ts">filtered 3.3 V</text><path d="M725.0 672L735.0 672" class="w w-ink2"/><text x="716.0" y="676" class="pinno" text-anchor="middle">7</text><text x="739.0" y="670" class="tm">OUT B</text><text x="739.0" y="684" class="ts">Rf 10k, 4.7 kΩ</text><path d="M725.0 708L735.0 708" class="w w-ink2"/><text x="716.0" y="712" class="pinno" text-anchor="middle">6</text><text x="739.0" y="706" class="tm">IN B−</text><text x="739.0" y="720" class="ts">Rf 10k, 1 kΩ</text><path d="M725.0 744L735.0 744" class="w w-ink2"/><text x="716.0" y="748" class="pinno" text-anchor="middle">5</text><text x="739.0" y="742" class="tm">IN B+</text><text x="739.0" y="756" class="ts">C3, bias</text><text x="695.0" y="790" class="ts" text-anchor="middle">100 nF straight across pins 8 and 4.</text><text x="695.0" y="806" class="ts" text-anchor="middle">Both halves are in the same chip:</text><text x="695.0" y="822" class="ts" text-anchor="middle">pins 8 and 4 power both.</text><text x="948.0" y="584" class="tb2">3 · Build tips</text><text x="948.0" y="608" class="ts">Breadboard + rail = filtered 3.3 V only (after R0),</text><text x="948.0" y="626" class="ts">− rail = GND. Nothing else on these rails.</text><text x="948.0" y="654" class="ts">One wire GND rail → an ESP GND pin; the display</text><text x="948.0" y="672" class="ts">GND goes to a different ESP GND pin.</text><text x="948.0" y="700" class="ts">Electrolytics: C0 + to the rail, C1 + to the mic,</text><text x="948.0" y="718" class="ts">10 µF + to the 1 kΩ (pin side).</text><text x="948.0" y="746" class="ts">Mic leads short; − is the pin joined to the case.</text><text x="948.0" y="774" class="ts">Function generator: mic out, ≤ 1 mVpp into C1</text><text x="948.0" y="792" class="ts">(100:1 divider: 10 kΩ then 100 Ω to GND).</text></svg>